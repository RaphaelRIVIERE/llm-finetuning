[project]
name = "llm-finetuning"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Raphaël RIVIERE", email = "raphaelriviere06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fr-core-news-md",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "en-core-web-md",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
