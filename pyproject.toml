[project]
name = "llm-finetuning"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Raphaël RIVIERE", email = "raphaelriviere06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "fastapi>=0.136.3",
    "fr-core-news-md",
    "mlflow>=3.16.1",
    "peft>=0.21.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy[asyncio]>=2.0",
    "torch>=2.7",
    "torchaudio",
    "torchvision",
    "tqdm>=4.70.0",
    "transformers>=5.17.0",
    "trl>=1.13.0",
    "uvicorn[standard]>=0.53.0",
    "vllm>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "en-core-web-md",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
