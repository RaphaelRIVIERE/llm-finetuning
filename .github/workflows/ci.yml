name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
          enable-cache: true

      # vLLM est simulé et Postgres remplacé par SQLite (voir tests/conftest.py), pas besoin de GPU.
      - name: Installer les dépendances
        run: uv sync --frozen --no-default-groups --group test

      - name: Lancer les tests
        run: uv run --no-sync pytest -v

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # L'image avec vLLM et torch pèse plusieurs Go, on libère de la place sur le runner.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: triage-chsa:${{ github.sha }}

      # Sans GPU on ne peut pas lancer vLLM, on vérifie juste que l'app s'importe.
      - name: Vérifier que l'application s'importe
        run: docker run --rm --entrypoint python triage-chsa:${{ github.sha }} -c "import app.main"

  # Modal reconstruit l'image à partir du même Dockerfile. Changer REVISION_MODELE dans
  # modal_app.py suffit pour déployer un nouveau modèle.
  deploy:
    needs: [tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Déployer sur Modal
        run: pipx run modal deploy modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
