name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche annule le run encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
          enable-cache: true

      # Seulement le groupe test : vLLM est remplacé par un faux moteur et Postgres par
      # SQLite (voir tests/conftest.py), pas besoin de GPU ni de torch.
      - name: Installer les dépendances
        run: uv sync --frozen --no-default-groups --group test

      # tests/test_integration.py est ignoré tout seul, API_URL n'étant pas défini.
      - name: Lancer les tests
        run: uv run --no-sync pytest -v

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # vLLM et torch avec CUDA pèsent plusieurs Go, plus que ce que le runner laisse
      # de libre par défaut. On supprime des outils préinstallés dont on ne se sert pas.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Construit l'image sans la publier. La publication viendra avec l'étape de
      # déploiement, une fois l'hébergeur choisi. load la rend disponible pour
      # l'étape suivante.
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: triage-chsa:${{ github.sha }}

      # Sans GPU, on ne peut pas démarrer vLLM. On vérifie au moins que l'app et vLLM
      # s'importent dans l'image : le moteur n'est créé qu'au démarrage de l'API.
      - name: Vérifier que l'application s'importe
        run: docker run --rm --entrypoint python triage-chsa:${{ github.sha }} -c "import app.main"
